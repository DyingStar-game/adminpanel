namespace: dyingstar-dev-local

backend:
  image:
    repository: dyingstar-admin-backend
    tag: dev
    pullPolicy: Never
  service:
    port: 3000
  env:
    CORS_ORIGIN: http://localhost:5173
    KEYCLOAK_BASE_URL: http://keycloak:8080
    RESOURCES_DYNAMIC_URL: http://service-resourcesdynamic:3001
    # One game server per panel (ADR 0024): SERVERS is no longer read.
    GAME_SERVER_NAME: Universe Testing
    PERSISTENCE_URL: http://service-persistence:3001

frontend:
  image:
    repository: dyingstar-admin-frontend
    tag: dev
    pullPolicy: Never
  service:
    port: 80
