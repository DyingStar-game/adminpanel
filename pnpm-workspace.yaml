packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  # Native binary comes from optional dependencies; its postinstall is only a fallback.
  unrs-resolver: false
  # Only copies the browser service worker; tests use MSW in Node.
  msw: false

minimumReleaseAgeExclude:
  - globals@17.13.0
  - vite@8.3.2
